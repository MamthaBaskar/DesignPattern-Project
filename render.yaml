services:
  - type: web
    name: ai-doc-compare
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false

